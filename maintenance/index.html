<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Michele Lofaro | Sito in manutenzione</title>
  <meta name="description" content="Il sito è temporaneamente in manutenzione. Torno online a breve.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236c5ce7'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='32' font-weight='700' text-anchor='middle' fill='%23fff'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fafaf7; --surface: #ffffff; --text: #14141a; --muted: #6b6b76; --border: #e6e4de;
      --accent: #6c5ce7; --accent-2: #ff7a59; --grid: rgba(20, 20, 40, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e13; --surface: #16161d; --text: #f3f3f7; --muted: #9a9aa8; --border: #2a2a35; --grid: rgba(255, 255, 255, 0.05); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(620px 420px at 88% 8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
        radial-gradient(520px 380px at 6% 88%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 70%);
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, #000 30%, transparent 100%);
      mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, #000 30%, transparent 100%);
    }
    main {
      position: relative; z-index: 1; width: min(520px, 100%); text-align: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
      padding: 48px 32px; box-shadow: 0 20px 60px -20px rgba(20, 20, 40, 0.3);
    }
    .icon {
      width: 76px; height: 76px; margin: 0 auto 24px; display: grid; place-items: center;
      border-radius: 22px; font-size: 2.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .icon span { display: inline-block; animation: spin 6s linear infinite; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.4rem); line-height: 1.15; letter-spacing: -0.02em; }
    .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin: 0 0 8px; color: var(--muted); }
    .status {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; padding: 6px 14px;
      border: 1px solid var(--border); border-radius: 999px; font-size: 0.85rem; color: var(--text);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: pulse 1.6s ease-in-out infinite; }
    .name { margin-top: 28px; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.25); } }
    @media (prefers-reduced-motion: reduce) { .icon span, .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true"><span>⚙️</span></div>
    <h1>Sito in <span class="grad">manutenzione</span></h1>
    <p>Sto lavorando a qualche aggiornamento.</p>
    <p>Tornerà online a breve: grazie per la pazienza!</p>
    <div class="status"><span class="dot"></span> Lavori in corso</div>
    <div class="name">Michele Lofaro</div>
  </main>
</body>
</html>
