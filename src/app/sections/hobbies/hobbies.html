<div class="container">
  <div class="section-head" reveal>
    <p class="section-eyebrow">Hobby</p>
    <h2>Quando non sono al lavoro</h2>
  </div>
  <div class="grid cols-3">
    @for (h of c.hobbies; track h.title) {
      <article class="card service" reveal>
        <div class="icon">{{ h.icon }}</div>
        <h3>{{ h.title }}</h3>
        <p class="muted">{{ h.text }}</p>
        <div class="tags">
          @for (t of h.tags; track t) {
            <span class="tag">{{ t }}</span>
          }
        </div>
      </article>
    }
  </div>
</div>
