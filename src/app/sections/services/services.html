<div class="container">
  <div class="section-head" reveal>
    <p class="section-eyebrow">Cosa faccio</p>
    <h2>Di cosa mi occupo</h2>
  </div>
  <div class="grid cols-4">
    @for (s of c.services; track s.title) {
      <article class="card service" reveal>
        <div class="icon">{{ s.icon }}</div>
        <h3>{{ s.title }}</h3>
        <p class="muted">{{ s.text }}</p>
      </article>
    }
  </div>
</div>
